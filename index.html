      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);

    @keyframes rainfall {

        opacity: 0;
      }
      20% {
        opacity: 0.85;
      }
      80% {
        opacity: 0.85;
      }
      100% {
        transform: translateY(180px) translateX(15px);
        opacity: 0;
      }
    }
    .raindrop-streak {
      position: absolute;
      width: 2px;
      height: 18px;
      background: linear-gradient(to bottom, rgba(56, 189, 248, 0.05), rgba(56, 189, 248, 0.75));
      border-radius: 9999px;
      animation: rainfall linear infinite;
      pointer-events: none;
    }
    .raindrop-streak-light {
      background: linear-gradient(to bottom, rgba(37, 99, 235, 0.05), rgba(37, 99, 235, 0.65));
    }

    @keyframes cloudFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-4px) scale(1.02); }
    }
    .anim-cloud-float {
      animation: cloudFloat 4.2s ease-in-out infinite;
    }

    /* Fade-in for modal overlays */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.22s ease-out forwards;

      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

</head>

    function App() {
      // Changed initial tab to 'courses' or 'dashboard'
      const [activeTab, setActiveTab] = useState('courses');
      const [theme, setTheme] = useState('dark');
      const [selectedRegion, setSelectedRegion] = useState('กทม.');

      // Live 1-second clock
      const [currentTime, setCurrentTime] = useState(new Date());
      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      // Theme synchronization
      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
          document.body.className = "bg-gradient-to-br from-[#1E1B4B] via-[#0F172A] to-[#1E1B4B] text-slate-100 antialiased selection:bg-lime-400 selection:text-slate-950 transition-colors duration-300 min-h-screen overflow-x-hidden max-w-full";
        } else {
          root.classList.remove('dark');
          document.body.className = "light-mode-theme antialiased selection:bg-indigo-900 selection:text-white transition-colors duration-300 min-h-screen overflow-x-hidden max-w-full";
        }
      }, [theme]);

      // Dynamic Greeting based on current hour
      const getGreeting = () => {
        const hr = currentTime.getHours();
        if (hr >= 5 && hr < 12) return 'สวัสดีตอนเช้า';
        if (hr >= 12 && hr < 17) return 'สวัสดีตอนบ่าย';
        if (hr >= 17 && hr < 21) return 'สวัสดีตอนเย็น';
        return 'สวัสดีตอนค่ำ';
      };

            <div 
              ref={(el) => { if (el) el.scrollTop = 0; }}
              className={`fixed inset-0 z-50 flex items-start justify-center pt-4 sm:pt-8 md:pt-10 px-3 sm:px-4 pb-12 overflow-y-auto backdrop-blur-md animate-fadeIn ${
                isDark ? 'bg-black/80 text-white' : 'bg-slate-900/50 text-slate-900'
              }`}
            >
              <div className={`w-full max-w-lg rounded-3xl border shadow-2xl overflow-hidden flex flex-col relative my-auto sm:my-0 ${
                isDark ? 'bg-[#0F1424] border-white/20' : 'bg-white border-slate-200'
              }`}>
                <div className="p-5 space-y-4">
                  <div className="flex justify-between items-center">
                    <h3 className="font-black text-base">{analyzedFood.name}</h3>
                    <button onClick={() => setAnalyzedFood(null)} className="text-slate-400 hover:text-white">
                      <Icon name="x" className="w-5 h-5" />
                    </button>
                  </div>
                  <img src={analyzedFood.image} alt={analyzedFood.name} className="w-full h-44 object-cover rounded-2xl" />
                  <div className="grid grid-cols-4 gap-2 text-center text-xs">
                    <div className="p-2 rounded-xl bg-lime-400/10 border border-lime-400/30">
                      <div className="text-[10px] text-slate-400">แคลอรี่</div>
                      <div className="font-black text-lime-400">{analyzedFood.calories}</div>
                    </div>
                    <div className="p-2 rounded-xl bg-indigo-500/10 border border-indigo-500/30">
                      <div className="text-[10px] text-slate-400">โปรตีน</div>
                      <div className="font-black text-indigo-400">{analyzedFood.protein}g</div>
                    </div>
                    <div className="p-2 rounded-xl bg-amber-500/10 border border-amber-500/30">
                      <div className="text-[10px] text-slate-400">คาร์บ</div>
                      <div className="font-black text-amber-400">{analyzedFood.carbs}g</div>
                    </div>
                    <div className="p-2 rounded-xl bg-cyan-500/10 border border-cyan-500/30">
                      <div className="text-[10px] text-slate-400">ดัชนีน้ำตาล</div>
                      <div className="font-black text-cyan-400">{analyzedFood.glycemicIndex}</div>
                    </div>
                  </div>
                  <p className="text-xs text-slate-300 bg-white/5 p-3 rounded-xl border border-white/10">
                    💡 <strong className="text-lime-400">คำแนะนำ:</strong> {analyzedFood.alignment}
                  </p>
                  <button 
                    onClick={() => {
                      setCaloriesConsumed(prev => prev + analyzedFood.calories);
                      alert(`บันทึก ${analyzedFood.name} (+${analyzedFood.calories} kcal) ลงในบันทึกประจำวันเรียบร้อย!`);
                      setAnalyzedFood(null);
                    }}
                    className="w-full py-2.5 bg-lime-400 text-slate-950 font-black text-xs rounded-xl hover:bg-lime-500"
                  >
                    บันทึกรายการนี้เข้ายอดแคลอรี่
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==============================================================
    // 5. MEDICATION MODULE
    // ==============================================================
    function MedicationModule({ isDark }) {
      const [isAddOpen, setIsAddOpen] = useState(false);
      const [meds, setMeds] = useState([
        { id: 1, name: 'Vitamin D3 2000 IU', time: '08:00 น.', taken: true },
        { id: 2, name: 'Omega-3 Fish Oil 1000mg', time: '12:00 น.', taken: false },
        { id: 3, name: 'Magnesium Glycinate', time: '21:30 น.', taken: false }
      ]);
      const [newMed, setNewMed] = useState('');

      const handleToggle = (id) => {
        setMeds(meds.map(m => m.id === id ? { ...m, taken: !m.taken } : m));
      };

      const handleAdd = (e) => {
        e.preventDefault();
        if (!newMed) return;
        setMeds([...meds, { id: Date.now(), name: newMed, time: '20:00 น.', taken: false }]);
        setNewMed('');
        setIsAddOpen(false);
      };

      return (
        <div className="space-y-4">
          <div className="flex justify-between items-center">
            <div>
              <h2 className={`text-xl sm:text-2xl font-black ${isDark ? 'text-white' : 'text-slate-900'}`}>
                ตารางเวลาทานยาและเวชภัณฑ์
              </h2>
              <p className="text-xs text-slate-400">ระบบเตือนอัตโนมัติพร้อมตัดสต็อกยาในครัวเรือน</p>
            </div>
            <button 
              onClick={() => {
                setIsAddOpen(true);
                window.scrollTo({ top: 0, behavior: 'instant' });
              }}
              className="px-4 py-2 bg-lime-400 text-slate-950 font-black text-xs rounded-xl hover:bg-lime-500 flex items-center gap-1.5"
            >
              <Icon name="plus" className="w-4 h-4 stroke-[3]" /> เพิ่มยาใหม่
            </button>
          </div>

          <div className="space-y-2.5">
            {meds.map(m => (
              <div 
                key={m.id}
                onClick={() => handleToggle(m.id)}
                className={`p-4 rounded-2xl border flex items-center justify-between cursor-pointer transition-all ${
                  isDark ? 'glass-card-dark' : 'glass-card-light'
                }`}
              >
                <div className="flex items-center gap-3">
                  <span className={`w-8 h-8 rounded-xl flex items-center justify-center text-sm ${
                    m.taken ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'
                  }`}>
                    {m.taken ? '✓' : '💊'}
                  </span>
                  <div>
                    <h4 className={`text-sm font-bold ${m.taken ? 'line-through text-slate-400' : ''}`}>{m.name}</h4>
                    <span className="text-xs text-slate-400">เวลาทาน: {m.time}</span>
                  </div>
                </div>
                <span className={`text-xs font-bold px-2.5 py-1 rounded-full ${
                  m.taken ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-800 text-slate-300'
                }`}>
                  {m.taken ? 'ทานแล้ว' : 'ยังไม่ทาน'}
                </span>
              </div>
            ))}
          </div>

          {isAddOpen && (
            <div 
              ref={(el) => { if (el) el.scrollTop = 0; }}
              className={`fixed inset-0 z-50 flex items-start justify-center pt-4 sm:pt-8 md:pt-10 px-3 sm:px-4 pb-12 overflow-y-auto backdrop-blur-md animate-fadeIn ${
                isDark ? 'bg-black/80' : 'bg-slate-900/50'
              }`}
            >
              <div className={`w-full max-w-md rounded-3xl border p-5 sm:p-6 space-y-4 shadow-2xl relative my-auto sm:my-0 ${
                isDark ? 'bg-slate-900 border-white/20 text-white' : 'bg-white border-slate-200 text-slate-900'
              }`}>
                <h3 className="text-base font-bold">เพิ่มยาใหม่</h3>
                <form onSubmit={handleAdd} className="space-y-3">
                  <input
                    type="text"
                    required
                    value={newMed}
                    onChange={(e) => setNewMed(e.target.value)}
                    placeholder="ชื่อยาหรือวิตามิน เช่น CoQ10 100mg"
                    className="w-full px-3 py-2 rounded-xl border bg-slate-800 border-slate-700 text-white text-xs outline-none"
                  />
                  <div className="flex gap-2">
                    <button type="submit" className="flex-1 py-2 bg-lime-400 text-slate-950 font-black text-xs rounded-xl hover:bg-lime-500">บันทึก</button>
                    <button type="button" onClick={() => setIsAddOpen(false)} className="px-4 py-2 bg-white/10 text-xs rounded-xl hover:bg-white/20">ยกเลิก</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==============================================================
    // 6. TELEMEDICINE MODULE
    // ==============================================================
    function TelemedModule({ isDark }) {
      return (
        <div className="space-y-4">
          <div>
            <h2 className={`text-xl sm:text-2xl font-black ${isDark ? 'text-white' : 'text-slate-900'}`}>
              ปรึกษาแพทย์และนักกายภาพออนไลน์ (Telemedicine)
            </h2>
            <p className="text-xs text-slate-400">วิดีโอคอลความคมชัดสูงพร้อมรับใบสั่งยาจัดส่งถึงบ้าน</p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {[
              { name: 'พญ. พรประภา (อายุรแพทย์โรคหัวใจ)', hosp: 'รพ. กรุงเทพ', status: 'พร้อมให้คำปรึกษา', img: 'https://images.unsplash.com/photo-1559839734-2b71ea197ec2?auto=format&fit=crop&w=400&q=80' },
              { name: 'นพ. วรเมธ (เวชศาสตร์ฟื้นฟูการกีฬา)', hosp: 'รพ. สมิติเวช', status: 'คิวถัดไป 14:00 น.', img: 'https://images.unsplash.com/photo-1622253692010-333f2da6031d?auto=format&fit=crop&w=400&q=80' }
            ].map((doc, idx) => (
              <div key={idx} className={`p-4 rounded-3xl border flex gap-3.5 items-center ${isDark ? 'glass-card-dark' : 'glass-card-light'}`}>
                <img src={doc.img} alt={doc.name} className="w-16 h-16 rounded-2xl object-cover" />
                <div className="flex-1 min-w-0">
                  <h4 className="font-bold text-sm truncate">{doc.name}</h4>
                  <p className="text-xs text-slate-400">{doc.hosp}</p>
                  <span className="inline-block mt-1 text-[10px] font-black px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400">
                    {doc.status}
                  </span>
                </div>
                <button 
                  onClick={() => alert(`เชื่อมต่อระบบวิดีโอคอลกับ ${doc.name}...`)}
                  className="px-3 py-2 bg-lime-400 text-slate-950 font-black text-xs rounded-xl hover:bg-lime-500"
                >
                  เริ่มปรึกษา
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
